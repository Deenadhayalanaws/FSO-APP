<!DOCTYPE html>
<html>
<head>
<title>Generate FSO Diary Icons</title>
<style>body{font-family:sans-serif;padding:20px;max-width:800px;margin:0 auto}</style>
</head>
<body>
<h1>FSO Diary Icon Generator</h1>
<p>This will generate the required app icons. Click the buttons below to download.</p>
<canvas id="canvas192" width="192" height="192"></canvas>
<canvas id="canvas512" width="512" height="512"></canvas>
<br><br>
<button onclick="download(192)">Download 192x192 Icon</button>
<button onclick="download(512)">Download 512x512 Icon</button>

<script>
function drawIcon(size) {
  const canvas = document.getElementById('canvas' + size);
  const ctx = canvas.getContext('2d');

  // Background
  ctx.fillStyle = '#1c6b45';
  ctx.fillRect(0, 0, size, size);

  // Document shape
  const pad = size * 0.2;
  const w = size * 0.6;
  const h = size * 0.7;
  const x = pad;
  const y = pad;

  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.lineTo(x + w * 0.7, y);
  ctx.lineTo(x + w, y + h * 0.15);
  ctx.lineTo(x + w, y + h);
  ctx.lineTo(x, y + h);
  ctx.closePath();
  ctx.fill();

  // Folded corner
  ctx.fillStyle = '#e6efe9';
  ctx.beginPath();
  ctx.moveTo(x + w * 0.7, y);
  ctx.lineTo(x + w, y + h * 0.15);
  ctx.lineTo(x + w * 0.7, y + h * 0.15);
  ctx.closePath();
  ctx.fill();

  // Lines on document
  ctx.strokeStyle = '#1c6b45';
  ctx.lineWidth = size * 0.015;
  const lineStart = x + w * 0.15;
  const lineEnd = x + w * 0.85;
  const lineY1 = y + h * 0.3;
  const lineY2 = y + h * 0.45;
  const lineY3 = y + h * 0.6;
  const lineY4 = y + h * 0.75;

  ctx.beginPath();
  ctx.moveTo(lineStart, lineY1);
  ctx.lineTo(lineEnd, lineY1);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(lineStart, lineY2);
  ctx.lineTo(lineEnd, lineY2);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(lineStart, lineY3);
  ctx.lineTo(lineEnd, lineY3);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(lineStart, lineY4);
  ctx.lineTo(lineEnd * 0.7, lineY4);
  ctx.stroke();
}

drawIcon(192);
drawIcon(512);

function download(size) {
  const canvas = document.getElementById('canvas' + size);
  canvas.toBlob(blob => {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'icon-' + size + '.png';
    a.click();
  });
}
</script>
</body>
</html>
