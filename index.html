<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="FSO Sample Diary - Food Safety Officer sample collection tracker. Works offline.">
<meta name="theme-color" content="#1c6b45">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FSO Diary">
<title>FSO Sample Diary</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700&display=swap">
<style>
:root{--bg:#f2f5f3;--card:#fff;--ink:#14231c;--mute:#5b6b63;--line:#d5ddd8;--acc:#1c6b45;--accink:#fff;--bad:#b3261e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101a15;--card:#18251e;--ink:#e6efe9;--mute:#9bb0a4;--line:#2c3d34;--acc:#4cc08a;--accink:#08130d;--bad:#ff8a80}}
:root[data-theme="dark"]{--bg:#101a15;--card:#18251e;--ink:#e6efe9;--mute:#9bb0a4;--line:#2c3d34;--acc:#4cc08a;--accink:#08130d;--bad:#ff8a80}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 'Public Sans',system-ui,sans-serif;transition:background 0.3s ease}
.app{max-width:720px;margin:0 auto;padding:12px 14px 40px;animation:fadeIn 0.5s ease}
h1{font-size:19px;margin:6px 0 2px;animation:slideDown 0.4s ease}
.sub{color:var(--mute);font-size:13px;margin:0 0 12px}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideDown{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes scaleIn{from{opacity:0;transform:scale(0.95)}to{opacity:1;transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.top{display:flex;gap:10px;align-items:end;margin-bottom:10px;animation:slideUp 0.5s ease}
.tabs{display:flex;border-bottom:2px solid var(--line);margin-bottom:14px}
.tabs button{flex:1;background:none;border:0;padding:10px 4px;font:600 15px inherit;font-family:inherit;color:var(--mute);border-bottom:3px solid transparent;margin-bottom:-2px;transition:all 0.3s ease;cursor:pointer}
.tabs button:hover{color:var(--ink);transform:translateY(-2px)}
.tabs button.on{color:var(--acc);border-color:var(--acc)}
label{display:block;font-size:13px;color:var(--mute);margin:8px 0 3px;transition:color 0.2s ease}
input,select{width:100%;padding:10px;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:6px;transition:all 0.3s ease}
input:hover,select:hover{border-color:var(--acc)}
input:focus,select:focus{outline:2px solid var(--acc);outline-offset:1px;transform:scale(1.01)}
button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{width:100%;margin-top:14px;padding:12px;font:600 15px inherit;font-family:inherit;background:var(--acc);color:var(--accink);border:0;border-radius:6px;cursor:pointer;transition:all 0.3s ease;position:relative;overflow:hidden}
.btn:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(28,107,69,0.3)}
.btn:active{transform:translateY(0);box-shadow:0 2px 6px rgba(28,107,69,0.2)}
.btn.alt{background:none;color:var(--acc);border:1px solid var(--acc)}
.btn.alt:hover{background:var(--acc);color:var(--accink);box-shadow:0 4px 12px rgba(28,107,69,0.2)}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:10px;transition:all 0.3s ease;animation:scaleIn 0.4s ease}
.card:hover{box-shadow:0 2px 8px rgba(0,0,0,0.1)}
.item{display:flex;justify-content:space-between;gap:10px;align-items:start;padding:9px 0;border-bottom:1px solid var(--line);animation:slideUp 0.3s ease;transition:background 0.2s ease}
.item:hover{background:rgba(28,107,69,0.05);margin:0 -14px;padding:9px 14px}
.item:last-child{border:0}
.item small{color:var(--mute);display:block}
.del{background:none;border:0;color:var(--bad);font:inherit;padding:4px 6px;cursor:pointer;transition:all 0.2s ease;border-radius:4px}
.del:hover{background:rgba(179,38,30,0.1);transform:scale(1.05)}
.empty{color:var(--mute);padding:10px 0;animation:fadeIn 0.5s ease}
.tot{font-weight:700;font-size:17px}
section{animation:fadeIn 0.4s ease}
.paper{background:#fff;color:#000;padding:16px;border:1px solid var(--line);border-radius:4px;font:13px/1.4 Arial,sans-serif;overflow-x:auto;animation:fadeIn 0.5s ease;transition:all 0.3s ease}
.paper table{border-collapse:collapse;width:100%;min-width:560px;margin:10px 0}
.paper th,.paper td{border:1px solid #000;padding:4px 6px}
.paper th{background:#d9d9d9}.paper td.n{text-align:right}.paper td.c{text-align:center}
.hide{display:none}
@media print{
body{background:#fff}.app>*:not(#rep){display:none!important}
html,body{margin:0}.app{padding:0;max-width:none}
#rep .noprint{display:none}.paper{border:0;padding:15mm;overflow:visible}.paper table{min-width:0}
@page{size:A4;margin:0}}
</style>
</head>
<body>
<div class="app">
<h1>FSO Sample Diary</h1>
<p class="sub">Works offline. Data stays on this phone.</p>
<div class="top"><div style="flex:1"><label for="month" style="margin:0 0 3px">Month</label><input type="month" id="month"></div></div>
<div class="tabs" role="tablist">
<button data-t="smp" class="on">Samples</button><button data-t="dsp">Courier</button><button data-t="rep">Report</button>
</div>

<section id="smp">
<div class="card">
<label for="fd">Date of sample collection</label><input type="date" id="fd">
<label for="fa">Name / nature of article</label><input id="fa" placeholder="e.g. Toor dal (loose condition)">
<div class="row"><div><label for="fn">Sample no.</label><input id="fn" placeholder="499/2026-27"></div>
<div><label for="fc">Sample cost (₹)</label><input type="number" inputmode="decimal" id="fc" value="0"></div></div>
<div class="row"><div><label for="ft">Type</label><select id="ft"><option value="Surveillance">Surveillance</option><option value="Act">Act (statutory)</option></select></div>
<div><label for="fdp">Courier dispatch</label><select id="fdp"></select></div></div>
<div id="np" class="hide"><label for="npc">Courier cost for this new parcel (₹)</label><input type="number" inputmode="decimal" id="npc" value="0"></div>
<button class="btn" id="add">Save sample</button>
</div>
<div class="card"><div id="list"></div></div>
</section>

<section id="dsp" class="hide">
<div class="card">
<p class="sub" style="margin-top:0">One courier dispatch covers many samples. Its cost is split across that group in the report.</p>
<div class="row"><div><label for="dd">Dispatch date</label><input type="date" id="dd"></div>
<div><label for="dc">Courier cost (₹)</label><input type="number" inputmode="decimal" id="dc" value="0"></div></div>
<button class="btn" id="addd">Add dispatch</button>
</div>
<div class="card"><div id="dlist"></div></div>
</section>

<section id="rep" class="hide">
<div class="card noprint">
<div class="row"><div><label for="rt">Sample type</label><select id="rt"><option value="Surveillance">Surveillance</option><option value="Act">Act (statutory)</option></select></div>
</div>
<div class="row"><div><label for="rn">From: your name</label><input id="rn"></div>
<div><label for="rd">Designation</label><input id="rd"></div></div>
<label for="rb">Block / area</label><input id="rb">
<div class="row"><div><label for="dist">District</label><input id="dist" value="Pudukkottai"></div>
<div><label for="sal">Salutation</label><input id="sal" value="Respected Madam"></div></div>
<label style="margin-top:14px">Other expenses this month (courier cover, gum, etc.)</label>
<div class="row"><div><input id="xn" placeholder="Item, e.g. A4 courier cover" aria-label="Item name"></div><div><input type="number" inputmode="decimal" id="xa" placeholder="₹ amount" aria-label="Amount"></div></div>
<button class="btn alt" id="addx" style="margin-top:8px">Add item</button>
<div id="xlist"></div>
<button class="btn" id="print">Save as PDF</button>
</div>
<div class="paper" id="paper"></div>
</section>
</div>

<script>
const $=s=>document.querySelector(s);
let D={samples:[],dispatches:[],cfg:{dist:'Pudukkottai',a4:0,sal:'Respected Madam'}};
try{const r=localStorage.getItem('fso1');if(r)D=Object.assign(D,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem('fso1',JSON.stringify(D))}catch(e){}};
const today=new Date().toISOString().slice(0,10);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fd=d=>d.split('-').reverse().join('.');
const inM=d=>d.slice(0,7)===$('#month').value;
const num=v=>+v||0;
$('#month').value=today.slice(0,7);$('#fd').value=today;$('#dd').value=today;
$('#dist').value=D.cfg.dist;$('#sal').value=D.cfg.sal;

document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
 document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));
 ['smp','dsp','rep'].forEach(t=>$('#'+t).classList.toggle('hide',t!==b.dataset.t));
 render();});
$('#month').onchange=render;

function nextNo(){
 const l=D.samples.length?D.samples[D.samples.length-1].no:'';
 const m=l.match(/^(\d+)(\/.*)$/);return m?(+m[1]+1)+m[2]:'';
}
const pLabel=d=>{const n=D.samples.filter(s=>s.disp==d.id).length;return `Parcel ${fd(d.date)} · ₹${d.cost} · ${n} sample${n==1?'':'s'}`};
function pOpts(cur,withNew){
 const ds=D.dispatches.filter(d=>inM(d.date)).sort((a,b)=>a.date.localeCompare(b.date)||a.id-b.id);
 return '<option value="">No courier cost</option>'+ds.map(d=>`<option value="${d.id}"${d.id==cur?' selected':''}>${pLabel(d)}</option>`).join('')+(withNew?'<option value="new">+ New parcel</option>':'');
}
function dispOpts(){
 const sel=$('#fdp'),cur=sel.value;
 sel.innerHTML=pOpts('',true);
 sel.value=[...sel.options].some(o=>o.value==cur)?cur:'new';
 $('#np').classList.toggle('hide',sel.value!=='new');
}
$('#fdp').onchange=()=>$('#np').classList.toggle('hide',$('#fdp').value!=='new');
window.setP=(id,v)=>{D.samples.find(s=>s.id==id).disp=v;save();render()};
$('#add').onclick=()=>{
 const a=$('#fa').value.trim(),n=$('#fn').value.trim();
 if(!$('#fd').value||!a||!n){alert('Enter the date, article name and sample number.');return}
 let p=$('#fdp').value;
 if(p==='new'){p=Date.now()+1;D.dispatches.push({id:p,date:$('#fd').value,cost:num($('#npc').value)});$('#npc').value=0}
 D.samples.push({id:Date.now(),date:$('#fd').value,art:a,no:n,cost:num($('#fc').value),type:$('#ft').value,disp:p});
 save();$('#fa').value='';$('#fn').value=nextNo();$('#fc').value=0;render();$('#fdp').value=p;$('#np').classList.add('hide');$('#fa').focus();
};
$('#addd').onclick=()=>{
 if(!$('#dd').value)return;
 D.dispatches.push({id:Date.now(),date:$('#dd').value,cost:num($('#dc').value)});
 save();$('#dc').value=0;render();
};
const dflt={rn:'K. Rajeswari',rd:'Food Safety Officer',rb:'Thirumayam & Arimalam Block'};
['rn','rd','rb'].forEach(k=>$('#'+k).value=D.cfg[k]??dflt[k]);
['dist','sal','rn','rd','rb'].forEach(k=>$('#'+k).oninput=()=>{D.cfg={dist:$('#dist').value,sal:$('#sal').value,rn:$('#rn').value,rd:$('#rd').value,rb:$('#rb').value};save();paper()});
D.extras=D.extras||[];
$('#addx').onclick=()=>{
 const n=$('#xn').value.trim(),a=num($('#xa').value);
 if(!n||!a){alert('Enter the item name and amount.');return}
 D.extras.push({id:Date.now(),month:$('#month').value,name:n,amt:a});
 save();$('#xn').value='';$('#xa').value='';render();
};
window.delX=id=>{D.extras=D.extras.filter(x=>x.id!=id);save();render()};
$('#rt').onchange=paper;
let LR=null;
function makePDF(){
 const R=LR,cf=D.cfg,fv=k=>cf[k]??dflt[k],PW=595,PH=842,MX=42,TW=511;
 const cw=[32,70,150,78,50,55,76],cx=[];let a=MX;cw.forEach(w=>{cx.push(a);a+=w});
 const pg=[];let o,y;
 const ex=s=>String(s).replace(/[^\x20-\x7e]/g,'?').replace(/([\\()])/g,'\\$1');
 const fw=(s,z,b)=>{let n=0;for(const ch of String(s))n+=/[iljtfI.,:;' ()\-\/!]/.test(ch)?.3:/[MWmw]/.test(ch)?.85:/[A-Z0-9]/.test(ch)?.62:.52;return n*z*(b?1.06:1)};
 const np=()=>{o=['0.6 w'];pg.push(o);y=PH-48};
 const T=(s,x,yy,z=10,b=0)=>o.push(`BT /F${b?2:1} ${z} Tf ${x.toFixed(1)} ${yy.toFixed(1)} Td (${ex(s)}) Tj ET`);
 const Rc=(x,yt,w,h,f)=>o.push(f?`0.85 g ${x} ${yt-h} ${w} ${h} re f 0 g ${x} ${yt-h} ${w} ${h} re S`:`${x} ${yt-h} ${w} ${h} re S`);
 const wrap=(s,w,z,b)=>{const out=[];let l='';String(s).split(/\s+/).forEach(wd=>{const t=l?l+' '+wd:wd;if(l&&fw(t,z,b)>w){out.push(l);l=wd}else l=t});if(l)out.push(l);return out.length?out:['']};
 const cell=(i,s,yt,h,al,z=10,b=0,span=1)=>{
  const w=cw.slice(i,i+span).reduce((p,q)=>p+q),ls=wrap(s,w-8,z,b),lh=z+2,top=yt-(h-ls.length*lh)/2-z+1;
  ls.forEach((l,k)=>{const tw=fw(l,z,b);T(l,al=='c'?cx[i]+(w-tw)/2:al=='r'?cx[i]+w-4-tw:cx[i]+4,top-k*lh,z,b)});
 };
 const head=()=>{const hs=['S.No','Date of sample collection','Name / nature of article','Sample No:','Sample Cost','Courier Cost','Total Amount'],h=34;
  hs.forEach((s,i)=>{Rc(cx[i],y,cw[i],h,1);cell(i,s,y,h,'c',9,1)});y-=h};
 const room=h=>{if(y-h<48){np();head()}};
 np();
 const L=(s,b)=>{T(s,MX,y,10,b);y-=14};
 L('From',1);L(fv('rn'));L(fv('rd'));L(fv('rb'));L('Food Safety & Drug Administration Department');L(cf.dist+' District');y-=8;
 L('To',1);L('The Designated Officer');L('Food Safety & Drug Administration Department');L(cf.dist+' District');y-=10;
 T('Subject:',MX,y,10,1);wrap(`Regarding ${R.lbl} expenditure reimbursement for ${R.mn}`,TW-50,10).forEach(l=>{T(l,MX+46,y,10);y-=14});
 L(cf.sal,1);y-=4;
 head();
 let i=0;
 R.groups.forEach(g=>{
  const hs=g.r.map(s=>Math.max(20,wrap(s.art,cw[2]-8,10).length*12+8)),gh=hs.reduce((p,q)=>p+q),sum=g.r.reduce((p,s)=>p+s.cost,0);
  room(gh);let yt=y;
  g.r.forEach((s,k)=>{const h=hs[k];
   [0,1,2,3,4].forEach(c=>Rc(cx[c],yt,cw[c],h));
   cell(0,String(++i),yt,h,'c');cell(1,fd(s.date),yt,h,'l');cell(2,s.art,yt,h,'l');cell(3,s.no,yt,h,'l');cell(4,String(s.cost),yt,h,'r');yt-=h});
  Rc(cx[5],y,cw[5],gh);Rc(cx[6],y,cw[6],gh);cell(5,g.c?String(g.c):'',y,gh,'c');cell(6,String(sum+g.c),y,gh,'c');y-=gh;
 });
 const sw=TW-cw[6];
 if(R.xt){const t=R.xs.map(x=>x.name).join(', '),h=Math.max(22,wrap(t,sw-8,10).length*12+8);
  room(h);Rc(cx[0],y,sw,h);Rc(cx[6],y,cw[6],h);cell(0,t,y,h,'c',10,0,6);cell(6,String(R.xt),y,h,'c');y-=h}
 const lt=`Total Expenditure for ${R.lbl} for the Month of ${R.mn}`,h=Math.max(26,wrap(lt,sw-8,10,1).length*12+10);
 room(h);Rc(cx[0],y,sw,h);Rc(cx[6],y,cw[6],h);cell(0,lt,y,h,'l',10,1,6);cell(6,String(R.grand),y,h,'c',11,1);y-=h;
 y-=18;if(y<70)np();
 wrap(`Kindly requested to provide the above expenses for ${R.lbl} for the Month of ${R.mn}.`,TW,10).forEach(l=>{T(l,MX,y,10);y-=14});
 const objs=[],kids=pg.map((_,k)=>`${5+k*2} 0 R`).join(' ');
 objs[1]='<< /Type /Catalog /Pages 2 0 R >>';objs[2]=`<< /Type /Pages /Kids [${kids}] /Count ${pg.length} >>`;
 objs[3]='<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>';
 objs[4]='<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>';
 pg.forEach((p,k)=>{const c=p.join('\n');
  objs[5+k*2]=`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${PW} ${PH}] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents ${6+k*2} 0 R >>`;
  objs[6+k*2]=`<< /Length ${c.length} >>\nstream\n${c}\nendstream`});
 let out='%PDF-1.4\n';const off=[];
 for(let k=1;k<objs.length;k++){off.push(out.length);out+=`${k} 0 obj\n${objs[k]}\nendobj\n`}
 const xr=out.length;
 out+=`xref\n0 ${objs.length}\n0000000000 65535 f \n`+off.map(v=>String(v).padStart(10,'0')+' 00000 n \n').join('')+`trailer\n<< /Size ${objs.length} /Root 1 0 R >>\nstartxref\n${xr}\n%%EOF`;
 return Uint8Array.from(out,c=>c.charCodeAt(0)&255);
}
$('#print').onclick=async()=>{
 paper();
 if(!LR||!LR.n){alert('There are no '+$('#rt').value.toLowerCase()+' samples in this month to put in the report.');return}
 const bytes=makePDF(),name=`Reimbursement_${LR.t}_${$('#month').value}.pdf`;
 try{
  const dl=window.claude&&await claude.use('downloads');
  if(dl){await dl.save({filename:name,data:bytes});return}
 }catch(e){if(e&&e.code==='declined')return;alert('Could not save the PDF: '+(e&&e.message||e));return}
 const u=URL.createObjectURL(new Blob([bytes],{type:'application/pdf'})),l=document.createElement('a');
 l.href=u;l.download=name;document.body.appendChild(l);l.click();l.remove();
};

window.delS=id=>{if(confirm('Delete this sample?')){D.samples=D.samples.filter(s=>s.id!=id);save();render()}};
window.delD=id=>{if(confirm('Delete this dispatch? Its samples become ungrouped.')){D.dispatches=D.dispatches.filter(d=>d.id!=id);D.samples.forEach(s=>{if(s.disp==id)s.disp=''});save();render()}};
window.setC=(id,v)=>{const d=D.dispatches.find(x=>x.id==id);d.cost=num(v);save();dispOpts()};

function render(){
 dispOpts();
 if(!$('#fn').value)$('#fn').value=nextNo();
 const ss=D.samples.filter(s=>inM(s.date)).sort((a,b)=>a.date.localeCompare(b.date)||a.id-b.id);
 $('#list').innerHTML=ss.length?ss.map(s=>`<div class="item"><div><b>${esc(s.art)}</b><small>${fd(s.date)} · ${esc(s.no)} · ${s.type} · ₹${s.cost}</small><select style="margin-top:6px;font-size:13px;padding:6px" aria-label="Parcel" onchange="setP(${s.id},this.value)">${pOpts(s.disp,false)}</select></div><button class="del" onclick="delS(${s.id})">Delete</button></div>`).join(''):'<div class="empty">No samples this month. Save your first one above.</div>';
 const ds=D.dispatches.filter(d=>inM(d.date)).sort((a,b)=>a.date.localeCompare(b.date));
 $('#dlist').innerHTML=ds.length?ds.map(d=>`<div class="item"><div><b>${fd(d.date)}</b><small>${D.samples.filter(s=>s.disp==d.id).length} samples</small></div><div style="display:flex;gap:6px;align-items:center"><input type="number" inputmode="decimal" style="width:90px" value="${d.cost}" aria-label="Courier cost" onchange="setC(${d.id},this.value)"><button class="del" onclick="delD(${d.id})">Delete</button></div></div>`).join(''):'<div class="empty">No dispatches this month. Add one when you send samples by courier.</div>';
 paper();
}

function paper(){
 const [y,m]=$('#month').value.split('-'),mn=new Date(y,m-1).toLocaleString('en',{month:'long'})+' '+y;
 const t=$('#rt').value;
 const ss=D.samples.filter(s=>inM(s.date)&&s.type===t).sort((a,b)=>a.date.localeCompare(b.date)||a.id-b.id);
 const groups=[],seen={};
 ss.forEach(s=>{
  if(s.disp&&D.dispatches.some(d=>d.id==s.disp)){
   if(!(s.disp in seen)){seen[s.disp]=groups.length;groups.push({c:D.dispatches.find(d=>d.id==s.disp).cost,r:[]})}
   groups[seen[s.disp]].r.push(s);
  }else groups.push({c:0,r:[s]});
 });
 let i=0,grand=0,rows='';
 groups.forEach(g=>{
  const sum=g.r.reduce((a,s)=>a+s.cost,0),tot=sum+g.c;grand+=tot;
  g.r.forEach((s,k)=>{
   rows+=`<tr><td class="c">${++i}</td><td>${fd(s.date)}</td><td>${esc(s.art)}</td><td>${esc(s.no)}</td><td class="n">${s.cost}</td>`+
   (k===0?`<td class="c" rowspan="${g.r.length}">${g.c||''}</td><td class="c" rowspan="${g.r.length}">${tot}</td>`:'')+'</tr>';
  });
 });
 const xs=(D.extras||[]).filter(x=>x.month===$('#month').value),xt=xs.reduce((a,x)=>a+x.amt,0);grand+=xt;
 if(xt)rows+=`<tr><td colspan="6" class="c">${xs.map(x=>esc(x.name)).join(', ')}</td><td class="c">${xt}</td></tr>`;
 $('#xlist').innerHTML=xs.map(x=>`<div class="item"><div>${esc(x.name)} <small>₹${x.amt}</small></div><button class="del" onclick="delX(${x.id})">Delete</button></div>`).join('');
 const lbl=`${t} Sample collection`;
 LR={t,mn,groups,xs,xt,grand,lbl,n:ss.length};
 const c=D.cfg,fv=k=>esc(c[k]??dflt[k]);
 $('#paper').innerHTML=`<b>From</b><br>${fv('rn')}<br>${fv('rd')}<br>${fv('rb')}<br>Food Safety &amp; Drug Administration Department<br>${esc(c.dist)} District<br><br><b>To</b><br>The Designated Officer<br>Food Safety &amp; Drug Administration Department<br>${esc(D.cfg.dist)} District<br><br>
 <b>Subject:</b> Regarding ${lbl} expenditure reimbursement for ${mn}<br><b>${esc(D.cfg.sal)}</b>
 ${ss.length?`<table><tr><th>S.No</th><th>Date of sample collection</th><th>Name / nature of article</th><th>Sample No:</th><th>Sample Cost</th><th>Courier Cost</th><th>Total Amount</th></tr>${rows}
 <tr><td colspan="6" class="c"><b>Total Expenditure for ${lbl} for the Month of ${mn}</b></td><td class="c"><b>${grand}</b></td></tr></table>
 Kindly requested to provide the above expenses for ${lbl} for the Month of ${mn}.`:'<p>No '+t.toLowerCase()+' samples found for this month.</p>'}`;
}
render();

// Install prompt
let deferredPrompt;
window.addEventListener('beforeinstallprompt',(e)=>{
 e.preventDefault();
 deferredPrompt=e;
 const installBtn=document.createElement('button');
 installBtn.className='btn alt';
 installBtn.textContent='📱 Install App';
 installBtn.style.position='fixed';
 installBtn.style.bottom='20px';
 installBtn.style.right='20px';
 installBtn.style.width='auto';
 installBtn.style.padding='10px 20px';
 installBtn.style.boxShadow='0 4px 12px rgba(0,0,0,0.3)';
 installBtn.style.zIndex='1000';
 installBtn.onclick=async()=>{
  if(!deferredPrompt)return;
  deferredPrompt.prompt();
  const {outcome}=await deferredPrompt.userChoice;
  if(outcome==='accepted')installBtn.remove();
  deferredPrompt=null;
 };
 document.body.appendChild(installBtn);
});
</script>
